name: Full-env e2e tests

on:
  workflow_call:

jobs:
  playwright-full-env:
    name: Full environment Playwright tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: v24.18.0

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --check-files --network-timeout 600000
        env:
          CI: true

      - name: Build
        run: yarn build
        env:
          CI: true

      - name: Run full-env e2e tests
        run: yarn playwright test --config=playwright.config.ts --project=chromium --reporter=list
        env:
          CI: true
