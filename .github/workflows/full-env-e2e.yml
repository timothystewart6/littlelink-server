name: Full-env e2e tests

on:
  workflow_call:

jobs:
  playwright-full-env:
    name: Full environment Playwright tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: v26.12.1

      - name: Install Dependencies
        run: yarn install --frozen-lockfile --check-files --network-timeout 600000
        env:
          CI: true

      - name: Build
        run: yarn build
        env:
          CI: true

      - name: Run full-env e2e tests
        run: yarn playwright test --config=playwright.config.ts --project=chromium --reporter=list
        env:
          CI: true
