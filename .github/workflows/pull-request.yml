name: 'Pull Request'
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

permissions:
  contents: read

jobs:
  quality-gate:
    name: Node quality gate
    uses: ./.github/workflows/install-lint-build.yml
    with:
      build-docker: true
